name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  workflow-lint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.22"
          cache: false

      - name: Run actionlint
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 -shellcheck=

  receipt-script-check:
    name: python-compile
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Compile deploy report script
        run: python3 -m py_compile scripts/deploy/write_report.py

  node24-action-guard:
    name: node24-action-guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Reject known Node 20 action majors
        run: |
          set -euo pipefail
          if grep -RInE 'actions/(checkout@v[1-4]|setup-node@v[1-5]|setup-python@v[1-5]|setup-go@v[1-5]|upload-artifact@v[1-4])' .github/workflows; then
            echo "Found GitHub Actions majors that still run on Node.js 20 or older. Upgrade them before merging." >&2
            exit 1
          fi
